[tasks.bootstrap]
description = "Caps Lock -> Control (defaults -currentHost, not supported by [bootstrap.macos.defaults])"
run = "./macos/capslock-to-control.sh"

[bootstrap.macos.dock]
orientation = "right"

[bootstrap.hooks]
post-defaults = "killall Dock || true"

[bootstrap.packages]
"brew:openssl@3" = "latest"
"brew:hyperfine" = "latest"

[tools]
gh = "latest"

[dotfiles]
"~/Library/KeyBindings/DefaultKeyBinding.dict" = { source = "../macos/DefaultKeyBinding.dict", mode = "copy" }
